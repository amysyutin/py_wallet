name: CI

on:
  pull_request: 
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: 
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.11"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Run tests
        run: pytest -m "not slow and not e2e" -v --tb=short

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=ci
          BINANCE_API_KEY=dummy
          BINANCE_SECRET=dummy
          EVM1_ADDRESS=0x0000000000000000000000000000000000000000
          RPC_URL_MAINNET=https://ethereum-rpc.publicnode.com
          RPC_URL_BASE=https://base.drpc.org
          RPC_URL_BNB=https://bsc.drpc.org
          RPC_URL_ARB=https://arbitrum-one-rpc.publicnode.com
          RPC_URL_LINEA=https://linea.drpc.org
          EOF

      - name: Validate compose file
        run: docker compose -f docker-compose.ci.yml config

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become healthy in time"
          exit 1

      - name: Smoke test endpoints
        run: |
          echo "--- GET / ---"
          curl -fsS http://127.0.0.1:8000/
          echo ""
          echo "--- GET /health ---"
          curl -fsS http://127.0.0.1:8000/health

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  notify:
    runs-on: ubuntu-latest
    needs: [test, compose-smoke]
    if: failure()
    timeout-minutes: 2

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with: 
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ CI FAILED on PR

            Repo: ${{ github.repository }}
            Branch: ${{ github.head_ref }}
            Author: ${{ github.actor }}

            Run: ${{ github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
                

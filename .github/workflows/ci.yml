name: CI

on:
  pull_request: 
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy: 
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.11"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@localhost:5432/wallet
      JWT_SECRET: ci-test-secret
      ACCESS_TOKEN_TTL_MIN: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate release version
        run: >-
          python -c 'from pathlib import Path; from app.core.config import Settings;
          assert Path("VERSION").read_text().strip() ==
          Settings.model_fields["app_version"].default'

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Run tests
        run: pytest -m "not slow and not e2e" -v --tb=short

      - name: Config security checks
        run: python scripts/check_config_security.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Gitleaks (current tree)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source /repo \
            --no-git \
            --redact \
            --config /repo/.gitleaks.toml \
            --exit-code 1

      - name: pip-audit
        run: python scripts/audit_dependencies.py

      - name: Bandit
        run: bandit -r app/ -ll -f json -o bandit-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            bandit-report.json
          retention-days: 14

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, security]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          EVM1_ADDRESS=0x0000000000000000000000000000000000000000
          RPC_URL_MAINNET=https://ethereum-rpc.publicnode.com
          RPC_URL_BASE=https://base.drpc.org
          RPC_URL_BNB=https://bsc.drpc.org
          RPC_URL_ARB=https://arbitrum-one-rpc.publicnode.com
          RPC_URL_LINEA=https://linea.drpc.org
          EOF

      - name: Validate compose file
        run: docker compose -f docker-compose.ci.yml config

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become healthy in time"
          exit 1

      - name: Smoke test endpoints
        run: |
          echo "--- GET / ---"
          curl -fsS http://127.0.0.1:8000/
          echo ""
          echo "--- GET /health ---"
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          echo "--- GET /health/live ---"
          curl -fsS http://127.0.0.1:8000/health/live
          echo ""
          echo "--- GET /health/ready ---"
          curl -fsS http://127.0.0.1:8000/health/ready
          echo ""
          echo "--- GET /metrics ---"
          curl -fsS http://127.0.0.1:8000/metrics | head -n 5

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  notify:
    runs-on: ubuntu-latest
    needs: [test, security, compose-smoke]
    if: failure()
    timeout-minutes: 2

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with: 
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ CI FAILED on PR

            Repo: ${{ github.repository }}
            Branch: ${{ github.head_ref }}
            Author: ${{ github.actor }}

            Run: ${{ github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
                

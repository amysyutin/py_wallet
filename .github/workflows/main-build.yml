name: Main Build

on:
  push:
    branches: [main]


permissions:
  contents: read
  packages: write

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@localhost:5432/wallet
      JWT_SECRET: ci-test-secret
      ACCESS_TOKEN_TTL_MIN: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run database migrations
        run: alembic upgrade head

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Run tests
        run: python -m pytest -m "not slow and not e2e" -v --tb=short

      - name: Config security checks
        run: python scripts/check_config_security.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Gitleaks (current tree)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect \
            --source /repo \
            --no-git \
            --redact \
            --config /repo/.gitleaks.toml \
            --exit-code 1

      - name: pip-audit
        continue-on-error: true
        run: pip-audit -r requirements.txt -f json -o pip-audit-report.json

      - name: Bandit
        continue-on-error: true
        run: bandit -r app/ -ll -f json -o bandit-report.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            pip-audit-report.json
            bandit-report.json
          retention-days: 14

  docker-build:
    needs: [test, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t py_wallet:${{ github.sha }} .

      - name: Save image like artifact
        run: docker save py_wallet:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1


  compose-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load image info Docker
        run: gunzip -c image.tar.gz | docker load

      - name: Retag image for compose
        run: docker tag py_wallet:${{ github.sha }} py_wallet:ci

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          BINANCE_API_KEY=dummy
          BINANCE_SECRET=dummy
          EVM1_ADDRESS=0x0000000000000000000000000000000000000000
          RPC_URL_MAINNET=https://ethereum-rpc.publicnode.com
          RPC_URL_BASE=https://base.drpc.org
          RPC_URL_BNB=https://bsc.drpc.org
          RPC_URL_ARB=https://arbitrum-one-rpc.publicnode.com
          RPC_URL_LINEA=https://linea.drpc.org
          EOF

      - name: Validate compose file
        run: docker compose -f docker-compose.ci.yml config

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Run database migrations
        run: docker compose -f docker-compose.ci.yml exec -T app alembic upgrade head  

      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become healthy in time"
          exit 1

      - name: Smoke test endpoints
        run: |
          echo "--- GET / ---"
          curl -fsS http://127.0.0.1:8000/
          echo ""
          echo "--- GET /health ---"
          curl -fsS http://127.0.0.1:8000/health
          echo ""
          echo "--- GET /health/live ---"
          curl -fsS http://127.0.0.1:8000/health/live
          echo ""
          echo "--- GET /health/ready ---"
          curl -fsS http://127.0.0.1:8000/health/ready
          echo ""
          echo "--- GET /metrics ---"
          curl -fsS http://127.0.0.1:8000/metrics | head -n 5
          echo ""
          echo "--- POST /auth/register ---"
          curl -fsS -X POST http://127.0.0.1:8000/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"password12"}'
          echo ""
          echo "--- GET /wallets (expect 403 without token) ---"
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:8000/wallets || true

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  build-and-tag:
    runs-on: ubuntu-latest
    needs: compose-smoke
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image 

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHA=${{ github.sha }}
          docker tag py_wallet:${SHA} ${IMAGE}:${SHA}
          docker push ${IMAGE}:${SHA}


  bump-gitops:
    needs: [build-and-tag]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v6
        with:
          repository: amysyutin/py_wallet-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Bump image tag in infra repo
        run: |
          cd infra/manifests/app
          kustomize edit set image ghcr.io/amysyutin/py_wallet=ghcr.io/${{ github.repository }}:${{ github.sha }}
          echo "Updated image tag to ${{ github.sha }}"

      - name: Commit and push
        run: |
          cd infra
          git config user.name "deploybot"
          git config user.email "deploybot@users.noreply.github.com"
          git add manifests/app/kustomization.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "deploy: bump py-wallet image to ${{ github.sha }}"
          git push origin main

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-tag, bump-gitops]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1.0.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && '❌ FAILED' || '✅ SUCCESS' }}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name}}
            Commit: ${{ github.sha}}
            Author: ${{ github.actor}}

            Run: ${{ github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
          


name: Main Build

on:
  push:
    branches: [main]


permissions:
  contents: read
  packages: write

concurrency:
  group: main-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: black --check .

      - name: Run tests
        run: pytest -m "not slow and not e2e" -v --tb=short

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t py_wallet:${{ github.sha }} .

      - name: Save image like artifact
        run: docker save py_wallet:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1


  compose-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          
      - name: Load image info Docker
        run: gunzip -c image.tar.gz | docker load

      - name: Retag image for compose
        run: docker tag py_wallet:${{ github.sha }} py_wallet:ci

      - name: Create .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=ci
          BINANCE_API_KEY=${{ secrets.BINANCE_API_KEY }}
          BINANCE_SECRET=${{ secrets.BINANCE_SECRET }}
          EVM1_ADDRESS=${{ secrets.EVM1_ADDRESS }}
          BYBIT_API_KEY=${{ secrets.BYBIT_API_KEY }}
          BYBIT_SECRET=${{ secrets.BYBIT_SECRET }}
          OKX_API_KEY=${{ secrets.OKX_API_KEY }}
          OKX_SECRET=${{ secrets.OKX_SECRET }}
          RPC_URL_MAINNET=https://ethereum-rpc.publicnode.com
          RPC_URL_BASE=https://base.drpc.org
          RPC_URL_BNB=https://bsc.drpc.org
          RPC_URL_ARB=https://arbitrum-one-rpc.publicnode.com
          RPC_URL_LINEA=https://linea.drpc.org
          EOF

      - name: Validate compose file
        run: docker compose -f docker-compose.ci.yml config

      - name: Start stack
        run: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo ""
              echo "Application is healthy"
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become healthy in time"
          exit 1

      - name: Smoke test endpoints
        run: |
          echo "--- GET / ---"
          curl -fsS http://127.0.0.1:8000/
          echo ""
          echo "--- GET /health ---"
          curl -fsS http://127.0.0.1:8000/health

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color

      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  build-and-tag:
    runs-on: ubuntu-latest
    needs: compose-smoke
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image 

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          SHA=${{ github.sha }}
          docker tag py_wallet:${SHA} ${IMAGE}:${SHA}
          docker tag py_wallet:${SHA} ${IMAGE}:latest
          docker push ${IMAGE}:${SHA}
          docker push ${IMAGE}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-tag
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/shared/cripto_analyzer
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

  notify:
    runs-on: ubuntu-latest
    needs: [deploy, build-and-tag]
    if: always()
    timeout-minutes: 2

    steps:
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ${{ contains(needs.*.result, 'failure') && '❌ FAILED' || '✅ SUCCESS'}}

            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name}}
            Commit: ${{ github.sha}}
            Author: ${{ github.actor}}

            Run: ${{ github.server_url}}/${{github.repository}}/actions/runs/${{github.run_id}}
          


services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: py_wallet:dev
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@postgres:5432/wallet
      SNAPSHOT_SERVICE_URL: http://py-wallet-snapshot-service:8001
      SNAPSHOT_INTERNAL_API_TOKEN: ${SNAPSHOT_INTERNAL_API_TOKEN:-change-me}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  wallet_pgdata:
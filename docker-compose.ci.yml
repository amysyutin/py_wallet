services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: py_wallet:ci
    env_file:
      - .env
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://wallet:wallet@postgres:5432/wallet
      JWT_SECRET: ci-test-secret
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
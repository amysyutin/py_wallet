services:
  app:
    image: ghcr.io/amysyutin/py_wallet:latest
    env_file:
      - /home/cript/cripto_secrets/.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      retries: 3
      start_period: 30s